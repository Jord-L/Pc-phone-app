name: phonedesk
description: Android client for the PhoneDesk server.
# Sideloaded app, never published to pub.dev.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  # Wide range on purpose: only the long-stable core API is used
  # (connect / ready / stream / sink), so any 2.4+ or 3.x release works.
  web_socket_channel: ">=2.4.0 <4.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
